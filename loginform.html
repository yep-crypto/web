<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="form-style.css">
</head>
<body class="login-body">

<div class="login-card">
    <p class="login-logo">Food Construct</p>
    <h2>Вход в личный кабинет</h2>

    <form action="https://httpbin.org/post" method="POST">
        <!-- Логин -->
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" placeholder="Ваш логин" required>
        </div>

        <!-- Пароль -->
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Ваш пароль" required>
        </div>

        <!-- Чекбокс Запомнить меня -->
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="remember_me">
                Запомнить меня
            </label>
        </div>

        <button type="submit" class="btn-submit">Войти</button>
    </form>
    <a href="index.html" class="login-back">← Вернуться на главную</a>
</div>

</body>
</html>
