<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="form-style.css">
</head>
<body>

  <div class="feedback-container">
    <h2>Форма обратной связи</h2>

    <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label for="fullname">ФИО</label>
            <input type="text" id="fullname" name="fullname" placeholder="Введите ФИО">
        </div>

        <div class="form-group">
            <label for="email">Электронная почта</label>
            <input type="email" id="email" name="email" placeholder="Введите email">
        </div>

        <div class="form-group">
            <label>Откуда вы узнали о нас?</label>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="source" value="friends" checked>
                    Рассказали знакомые
                </label>
                <label class="radio-label">
                    <input type="radio" name="source" value="internet">
                    Реклама в интернете/соцсетях
                </label>
                <label class="radio-label">
                    <input type="radio" name="source" value="poster">
                    Постеры на улице
                </label>
                <label class="radio-label">
                    <input type="radio" name="source" value="others">
                    Другое
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="category">Обращение</label>
            <select id="category" name="category">
                <option value="proposal">Предложение</option>
                <option value="complaint">Жалоба</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Текст сообщения</label>
            <textarea id="message" name="message" rows="6" placeholder="Напишите ваше сообщение здесь"></textarea>
        </div>

        <div class="form-group">
            <label for="attachment">Вложение</label>
            <input type="file" id="attachment" name="attachment">
        </div>

        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="accept" required>
                Даю согласие на обработку персональных данных
            </label>
        </div>

        <button type="submit" class="btn-submit">Отправить</button>
    </form>
  </div>


</body>
</html>
